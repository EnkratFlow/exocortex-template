name: Quick Exocortex verification

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Enforce public release boundary
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          GIT_NO_REPLACE_OBJECTS: "1"
        run: |
          python3 scripts/check-public-release.py --root .
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 scripts/check-public-release.py --root . \
              --baseline "$PR_BASE_SHA" --candidate "$CANDIDATE_SHA"
          elif [ "$REF_TYPE" = tag ] && [[ "$REF_NAME" == v* ]]; then
            CANDIDATE_TAG_REF="refs/exocortex-release-tags/$REF_NAME"
            git fetch --no-tags --force origin \
              "refs/tags/$REF_NAME:$CANDIDATE_TAG_REF" \
              || { echo 'TAG_OBJECT_FETCH_FAILED' >&2; exit 1; }
            TAG_OBJECT="$(git rev-parse --verify "$CANDIDATE_TAG_REF")" \
              || { echo 'TAG_OBJECT_UNAVAILABLE' >&2; exit 1; }
            [ "$(git cat-file -t "$TAG_OBJECT")" = tag ] \
              || { echo 'TAG_OBJECT_TYPE_INVALID: annotated tag required' >&2; exit 1; }
            PEELED_CANDIDATE="$(git rev-parse --verify "$TAG_OBJECT^{commit}")" \
              || { echo 'TAG_PEELED_COMMIT_UNAVAILABLE' >&2; exit 1; }
            EVENT_CANDIDATE_COMMIT="$(git rev-parse --verify "$CANDIDATE_SHA^{commit}")" \
              || { echo 'TAG_EVENT_CANDIDATE_UNAVAILABLE' >&2; exit 1; }
            [ "$EVENT_CANDIDATE_COMMIT" = "$PEELED_CANDIDATE" ] \
              || { echo 'TAG_EVENT_CANDIDATE_MISMATCH' >&2; exit 1; }
            BASELINE_RECORD_VALUES="$(python3 -I - "$REF_NAME" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          def no_duplicates(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError("duplicate key")
                  value[key] = item
              return value

          try:
              value = json.loads(
                  Path('.exocortex/release-baseline.json').read_text(encoding='utf-8'),
                  object_pairs_hook=no_duplicates,
              )
          except (OSError, TypeError, ValueError):
              raise SystemExit(1)
          expected = {
              'schema_version',
              'kind',
              'previous_published_tag',
              'previous_published_commit',
          }
          if not isinstance(value, dict) or set(value) != expected \
              or value['schema_version'] != 'public-v1' \
              or value['kind'] != 'exocortex_release_baseline':
              raise SystemExit(1)
          tag = value['previous_published_tag']
          commit = value['previous_published_commit']
          if not isinstance(tag, str) or not isinstance(commit, str):
              raise SystemExit(1)
          baseline = re.fullmatch(r'v([0-9]+)\.([0-9]+)\.([0-9]+)', tag)
          candidate = re.fullmatch(r'v([0-9]+)\.([0-9]+)\.([0-9]+)', sys.argv[1])
          if baseline is None or candidate is None \
              or re.fullmatch(r'[0-9a-f]{40,64}', commit) is None:
              raise SystemExit(1)
          if tuple(map(int, baseline.groups())) >= tuple(map(int, candidate.groups())):
              raise SystemExit(1)
          print(f'{tag}\t{commit}')
          PY
            )" || { echo 'TAG_BASELINE_RECORD_INVALID' >&2; exit 1; }
            [ -n "$BASELINE_RECORD_VALUES" ] \
              || { echo 'TAG_BASELINE_RECORD_INVALID' >&2; exit 1; }
            IFS=$'\t' read -r RECORDED_BASELINE_TAG RECORDED_BASELINE <<< "$BASELINE_RECORD_VALUES"
            [ -n "$RECORDED_BASELINE_TAG" ] && [ -n "$RECORDED_BASELINE" ] \
              || { echo 'TAG_BASELINE_RECORD_INVALID' >&2; exit 1; }
            RECORDED_BASELINE_TAG_REF="refs/exocortex-release-tags/$RECORDED_BASELINE_TAG"
            git fetch --no-tags --force origin \
              "refs/tags/$RECORDED_BASELINE_TAG:$RECORDED_BASELINE_TAG_REF" \
              || { echo 'TAG_BASELINE_TAG_FETCH_FAILED' >&2; exit 1; }
            RECORDED_BASELINE_TAG_OBJECT="$(git rev-parse --verify "$RECORDED_BASELINE_TAG_REF")" \
              || { echo 'TAG_BASELINE_TAG_UNAVAILABLE' >&2; exit 1; }
            [ "$(git cat-file -t "$RECORDED_BASELINE_TAG_OBJECT")" = tag ] \
              || { echo 'TAG_BASELINE_TAG_TYPE_INVALID: annotated tag required' >&2; exit 1; }
            RECORDED_BASELINE_TARGET="$(git cat-file -p "$RECORDED_BASELINE_TAG_OBJECT" \
              | sed -n 's/^object //p' | head -n 1)"
            RECORDED_BASELINE_TARGET_TYPE="$(git cat-file -p "$RECORDED_BASELINE_TAG_OBJECT" \
              | sed -n 's/^type //p' | head -n 1)"
            [ "$RECORDED_BASELINE_TARGET_TYPE" = commit ] \
              && [[ "$RECORDED_BASELINE_TARGET" =~ ^[0-9a-f]{40,64}$ ]] \
              && [ "$(git cat-file -t "$RECORDED_BASELINE_TARGET" 2>/dev/null)" = commit ] \
              || { echo 'TAG_BASELINE_DIRECT_TARGET_INVALID' >&2; exit 1; }
            [ "$RECORDED_BASELINE_TARGET" = "$RECORDED_BASELINE" ] \
              || { echo 'TAG_BASELINE_COMMIT_MISMATCH' >&2; exit 1; }
            [ "$RECORDED_BASELINE" != "$PEELED_CANDIDATE" ] \
              || { echo 'TAG_BASELINE_EQUALS_CANDIDATE' >&2; exit 1; }
            git merge-base --is-ancestor "$RECORDED_BASELINE" "$PEELED_CANDIDATE" \
              || { echo 'TAG_BASELINE_NOT_ANCESTOR' >&2; exit 1; }
            RELEASE_RANGE_BASE="$RECORDED_BASELINE"
            CANDIDATE_PARENT_COUNT="$(git rev-list --parents -n 1 "$PEELED_CANDIDATE" \
              | awk '{print NF - 1}')" \
              || { echo 'TAG_PARENT_COUNT_INVALID' >&2; exit 1; }
            [[ "$CANDIDATE_PARENT_COUNT" =~ ^[0-9]+$ ]] \
              || { echo 'TAG_PARENT_COUNT_INVALID' >&2; exit 1; }
            if [ "$CANDIDATE_PARENT_COUNT" -ge 2 ]; then
              RELEASE_RANGE_BASE="$(git rev-parse --verify "$PEELED_CANDIDATE^1")" \
                || { echo 'TAG_RELEASE_RANGE_BASE_INVALID' >&2; exit 1; }
              git merge-base --is-ancestor "$RECORDED_BASELINE" "$RELEASE_RANGE_BASE" \
                || { echo 'TAG_RELEASE_RANGE_BASE_NOT_DESCENDANT' >&2; exit 1; }
            fi
            python3 scripts/check-public-release.py --root . \
              --baseline "$RELEASE_RANGE_BASE" --candidate "$PEELED_CANDIDATE" \
              --tag-object "$TAG_OBJECT"
          elif [ -n "$PUSH_BEFORE_SHA" ] \
            && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null \
              || { echo 'PUSH_BASE_UNAVAILABLE: refusing current-tree-only success' >&2; exit 1; }
            python3 scripts/check-public-release.py --root . \
              --baseline "$PUSH_BEFORE_SHA" --candidate "$CANDIDATE_SHA"
          else
            echo 'PUSH_BASE_ZERO: refusing branch-history coverage gap' >&2
            exit 1
          fi
      - name: Verify complete committed code-plane checksums
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          protected_files = {
              'SESSION_CONTEXT.md','SESSION_CONTEXT.md.backup','SESSION_CONTEXT.local.md','TODO.md','LESSONS.md',
              'PROJECT_MEMORY.md','OPEN_DECISIONS.md','subconscious_patterns.md','.env',
              '.project-name','.install-manifest','.hub_enabled','.hub_disabled',
          }
          protected_prefixes = ('events/','archive/','hub/','local/','planning/','work-items/')
          protected_control = {
              'control/ACTIVE_WORK.md','control/BRANCH_POLICY.md','control/REPO_STATE.md',
              'control/EXECUTOR_REGISTRY.json','control/EXTERNAL_SYNC_POLICY.json',
              'control/INTERRUPTS.md','control/BACKLOG.md','control/ROADMAP.md',
              'control/ARCH_OVERVIEW.md','control/REPO_ORGANIZATION_REPORT.md',
          }
          def include(rel):
              if rel == 'SHA256SUMS': return False
              parts = Path(rel).parts
              if '.git' in parts or '.env' in parts: return False
              if '__pycache__' in parts or rel.endswith(('.pyc', '.pyo')): return False
              if rel.startswith('.exocortex/'):
                  value=rel[len('.exocortex/'):]
                  if value in protected_files or value in protected_control: return False
                  if value.startswith('SESSION_CONTEXT_BACKUP_') and value.endswith('.md') and '/' not in value: return False
                  if value.startswith(protected_prefixes): return False
              return True
          lines=[]
          root=Path('.')
          files=[]
          for path in root.rglob('*'):
              rel=path.relative_to(root).as_posix()
              if not include(rel): continue
              if path.is_symlink(): raise SystemExit(f'code-plane symlink is not allowed: {rel}')
              if path.is_file(): files.append((rel,path))
          for rel,path in sorted(files):
              lines.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {rel}\n')
          Path('/tmp/SHA256SUMS.expected').write_text(''.join(lines), encoding='utf-8')
          PY
          diff -u SHA256SUMS /tmp/SHA256SUMS.expected
      - name: Verify tag matches packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(sed -n '1p' VERSION)" = "$GITHUB_REF_NAME"
      - name: Verify active documentation contract
        run: python3 tests/test_documentation_contract.py
      - name: Verify generated provider adapters
        run: python3 .exocortex/scripts/generate_command_adapters.py --check
