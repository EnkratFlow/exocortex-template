name: Windows install and update
on:
  push:
    branches: [codex/windows-update-support]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-update:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install, register, update and preserve memory from PowerShell
        shell: pwsh
        run: python tests/test_windows_update.py
