name: Exocortex deterministic verification

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  phase-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install deterministic test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y git rsync ripgrep
      - name: Verify generated provider adapters
        run: python3 .exocortex/scripts/generate_command_adapters.py --check
      - name: Run Phase B evidence harness
        run: bash tests/phase-b/run.sh /tmp/exo-phase-b-evidence.github
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-b-evidence
          path: /tmp/exo-phase-b-evidence.github
          retention-days: 14
