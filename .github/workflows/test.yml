name: Complete Exocortex safety suite

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Keep this identifier stable: the main-branch rule requires `phase-b`.
  phase-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Enforce public release boundary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/check-public-release.py --root .
          if [ -n "$BASE_SHA" ]; then
            python3 scripts/check-public-release.py --root . \
              --baseline "$BASE_SHA" --candidate "$CANDIDATE_SHA"
          fi
      - name: Install deterministic test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y git rsync ripgrep
      - name: Verify generated provider adapters
        run: python3 .exocortex/scripts/generate_command_adapters.py --check
      - name: Run complete Exocortex safety suite
        run: bash tests/phase-b/run.sh /tmp/exo-phase-b-evidence.github
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: complete-safety-suite-evidence
          path: /tmp/exo-phase-b-evidence.github
          retention-days: 14
