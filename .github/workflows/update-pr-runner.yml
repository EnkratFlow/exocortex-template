name: Update pull-request runner

on:
  pull_request:
    paths:
      - 'tools/update-dashboard/pr_runner*.py'
      - 'tests/test_pr_runner*.py'
      - '.exocortex/scripts/**'
      - '.github/workflows/update-pr-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify runner without credentials or network
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p 'test_pr_runner*.py' -v
